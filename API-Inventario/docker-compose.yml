version: '3.9'

services:

  api:
    build: .
    container_name: emi_api

    ports:
      - "8080:8080"

    env_file:
      - app.env

    depends_on:
      - db

  db:
    image: mysql:8

    container_name: emi_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: hola123
      MYSQL_DATABASE: inventariodb2

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: